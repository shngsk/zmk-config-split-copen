# Diagnostic-only Kconfig fragment for isolating hw vs sw on the left half.
# Enables USB (normally off on copen2_L) plus debug logging over the USB
# CDC ACM console, so kscan/position events can be observed while the
# device is plugged into a PC via USB alone -- no BLE pairing to the
# central (copen2_R) required. This shield contributes no devicetree
# changes; combine with "copen2_L" in build.yaml, e.g.:
#   shield: copen2_L copen2_l_dbg
#
# NOT for production use -- flash back the normal copen2_L.uf2 afterwards.
CONFIG_ZMK_USB=y
CONFIG_ZMK_USB_LOGGING=y
CONFIG_LOG_DEFAULT_LEVEL=4
