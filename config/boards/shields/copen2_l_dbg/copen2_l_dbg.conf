# Diagnostic-only Kconfig fragment for isolating hw vs sw on the left half.
# Enables debug logging over a USB CDC ACM console, so kscan/position
# events can be observed while the device is plugged into a PC via USB
# alone -- no BLE pairing to the central (copen2_R) required. This shield
# contributes no devicetree changes; combine with "copen2_L" in
# build.yaml, e.g.:
#   shield: copen2_L copen2_l_dbg
#
# NOTE: CONFIG_ZMK_USB itself cannot be enabled on a split peripheral
# (ZMK's own Kconfig requires ZMK_SPLIT_ROLE_CENTRAL for ZMK_USB -- setting
# it here just produces a "was assigned 'y' but got 'n'" warning and has no
# effect, so it's intentionally omitted). This means the device will NOT
# act as a USB keyboard. CONFIG_ZMK_USB_LOGGING pulls in USB_CDC_ACM +
# USB_DEVICE_STACK + LOG_BACKEND_UART on its own, independent of ZMK_USB,
# so the serial log console still works for this diagnostic.
#
# NOT for production use -- flash back the normal copen2_L.uf2 afterwards.
CONFIG_ZMK_USB_LOGGING=y
CONFIG_LOG_DEFAULT_LEVEL=3
