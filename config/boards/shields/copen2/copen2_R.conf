CONFIG_ZMK_KEYBOARD_NAME="copen2"

CONFIG_ZMK_USB=y
CONFIG_ZMK_POINTING=y
CONFIG_NFCT_PINS_AS_GPIOS=y
CONFIG_ZMK_BLE=y
CONFIG_ZMK_MOUSE=y

CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# ZMK STUDIO
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=y

# BLE reconnection improvement
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# Extend sleep timeout to prevent BLE disconnect before host reconnects
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000