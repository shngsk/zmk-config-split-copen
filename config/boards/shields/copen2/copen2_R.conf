CONFIG_ZMK_KEYBOARD_NAME="copen2"

CONFIG_ZMK_USB=y
CONFIG_ZMK_POINTING=y
CONFIG_NFCT_PINS_AS_GPIOS=y
CONFIG_ZMK_BLE=y
CONFIG_ZMK_MOUSE=y

CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# ZMK STUDIO
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=y

# BLE reconnection improvement
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# Allow legacy pairing fallback for macOS SC reconnection compatibility
CONFIG_BT_SMP_SC_PAIR_ONLY=n
CONFIG_BT_KEYS_OVERWRITE_OLDEST=y

# macOS PHY negotiation fix
CONFIG_BT_CTLR_PHY_2M=n

# XIAO BLE: use internal RC oscillator for BLE stability
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y

# Save BLE bond (LTK) to flash immediately after pairing (default ~60s debounce)
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=0