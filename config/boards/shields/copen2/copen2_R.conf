CONFIG_ZMK_KEYBOARD_NAME="copen2"

CONFIG_ZMK_USB=y
CONFIG_ZMK_POINTING=y
CONFIG_NFCT_PINS_AS_GPIOS=y
CONFIG_ZMK_BLE=y
CONFIG_ZMK_MOUSE=y

CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# NVS: required for BLE bond (LTK) persistence across power cycles
# xiao_ble//zmk defconfig enables these, but //zmk also enables HW_STACK_PROTECTION
# which triggers CONFIG_RUNTIME_ERROR_CHECKS=y and breaks ZMK CI. Add manually instead.
CONFIG_MPU_ALLOW_FLASH_WRITE=y
CONFIG_NVS=y
CONFIG_SETTINGS_NVS=y
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y

# ZMK STUDIO
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=y
