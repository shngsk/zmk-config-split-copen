# Diagnostic-only Kconfig fragment: makes the left half run as a
# standalone split "central" with USB HID enabled, instead of its normal
# BLE-only peripheral role. Devicetree (row/col GPIO wiring, matrix
# transform, keymap) is untouched -- this uses copen2_L's REAL physical
# layout as-is. Combine with "copen2_L" in build.yaml, e.g.:
#   shield: copen2_L copen2_l_standalone
#
# Purpose: isolate whether the left half's physical wiring/overlay itself
# produces correct key input, independent of BLE/peripheral pairing.
# Plug into a PC via USB and type into a text editor -- if keys register
# (correctly or not), the row/col wiring for those keys is electrically
# fine and the real bug is peripheral/BLE-side. If nothing registers,
# the wiring/overlay itself is suspect.
#
# NOT for production use -- flash back the normal copen2_L.uf2 afterwards.
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y
CONFIG_ZMK_USB=y
